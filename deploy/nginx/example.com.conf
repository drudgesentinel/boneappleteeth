# Include inside nginx.conf's http block (for example via /etc/nginx/conf.d/).
# Assumes Nginx and Express run directly on the same VPS.
# Obtain the certificate before enabling the HTTPS server block.
server {
    listen 80;
    listen [::]:80;
    server_name example.com;

    # Webroot used by the ACME client for issuance and renewal.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location / {
        return 301 https://example.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name example.com;

    ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:BoneAppleTeethTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Matches Express's maximum raw image upload size.
    client_max_body_size 5m;

    location / {
        # Express serves both the built frontend and /api routes.
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # This is the public edge proxy: replace untrusted forwarded headers.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
    }
}

services:
  db:
    image: docker.io/library/postgres:17-alpine
    environment:
      POSTGRES_USER: recipes
      POSTGRES_PASSWORD: recipes
      POSTGRES_DB: recipes
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - recipes_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U recipes']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  recipes_data:
